name: Image

# Builds boxeuntu and publishes it as ghcr.io/16bitsrl/boxeuntu:<date>[-n].
# Every installation of boxe downloads a new version within a day and starts
# new VMs from it, so this runs only when the image changes on main. By hand
# on another branch it builds and checks the image without publishing it.
on:
  push:
    branches: [main]
    paths:
      - image/**
      - "!image/laravel/**" # built on the hosts, from boxeuntu
      - cmd/boxeuntu/**
      - cmd/boxe-computer/**
      - go.mod
      - go.sum
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/16bitsrl/boxeuntu

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe, for the boxe it was built from

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tools of the image
        run: |
          go test ./cmd/boxeuntu/... ./cmd/boxe-computer/...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o image/boxeuntu ./cmd/boxeuntu
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o image/boxe-computer ./cmd/boxe-computer

      - name: Room for the image
        # exeuntu and boxeuntu take some 16 GB, more than the runner has free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build --build-arg BOXE_SOURCE="$(git describe --tags --always)" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t boxeuntu:build image/
          # What boxe needs from it.
          docker run --rm --entrypoint sh boxeuntu:build -c \
            'set -e; id boxedev; for f in boxeuntu boxe-computer boxe-init; do test -x /usr/local/bin/$f; done; test -x /usr/bin/xdotool
              LD_BIND_NOW=1 voxl --version; test -x /usr/bin/Xvfb; test -x /usr/bin/pulseaudio
              su boxedev -c "browse --version"; test -s /usr/local/share/boxe/browse-extension/browse.crx
              grep -q "$(cat /usr/local/share/boxe/browse-extension/id);file://" /etc/opt/chrome/policies/managed/boxe.json
              cat /etc/boxe-image'

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          # A second image the same day is <date>-2: a published tag is never
          # replaced, or hosts that have it would not see the new one.
          day=$(date -u +%Y%m%d) tag=$day n=1
          while out=$(docker manifest inspect "$IMAGE:$tag" 2>&1); do
            n=$((n + 1)) tag=$day-$n
          done
          if ! grep -qiE 'manifest unknown|name unknown|not found|no such manifest' <<<"$out"; then
            echo "Could not tell whether $IMAGE:$tag exists: $out" >&2
            exit 1
          fi
          docker tag boxeuntu:build "$IMAGE:$tag"
          docker tag boxeuntu:build "$IMAGE:latest"
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
